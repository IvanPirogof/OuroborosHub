name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML pytest
      # Entries are canonical. Owner updates may omit the generated v1 file;
      # Sync Joi Lab Mirror publishes it from merged main before mirroring.
      - run: python scripts/build_index.py
      - run: python scripts/build_index.py --check
      - run: python -m unittest discover -s tests -v
      - name: Smart Lists registered tools and routes
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q -rs skills/smart_lists/tests
      - run: python -B skills/gigasearch/test_gigasearch.py -v
      - run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q skills/cache_efficiency_snapshot/test_cache_efficiency.py
      - run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q tests/test_widget_theme_contracts.py
      - name: Record owner-update eligibility without secrets
        if: github.event_name == 'pull_request'
        run: python -B scripts/owner_updates.py verdict --output "$RUNNER_TEMP/owner-verdict/verdict.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: owner-update-verdict
          path: ${{ runner.temp }}/owner-verdict/verdict.json
          if-no-files-found: error
          retention-days: 3

  calendar-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install icalendar python-dateutil cryptography pytest
      - name: Run the calendar skill's offline suite
        # Runtime dependencies are installed; opt-in Playwright browser tests may skip here.
        # Provider transports are in-memory fakes; no account, token or network is used.
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q skills/calendar/tests

  transport-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest httpx starlette websockets
      - name: Check Slack schemas and offline transport behavior
        # Provider HTTP calls are mocked. Optional core consumer probes skip
        # without a local Ouroboros checkout; no live core or credentials are used.
        # Separate interpreters preserve sibling-test imports without basename collisions.
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q -rs skills/slack-bridge/tests
      - name: Check Telegram schemas and offline transport behavior
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -p no:cacheprovider -q -rs skills/telegram-bot/tests
